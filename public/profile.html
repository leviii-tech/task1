<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Settings - ShopNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav-bar">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon"><i class="bi bi-bag-check-fill"></i></div>
        <div class="brand-text">Shop<span>Nova</span></div>
      </a>

      <form class="nav-search-form">
        <input type="text" class="nav-search-input" placeholder="Search gadgets, audio, laptops...">
        <button type="submit" class="nav-search-btn"><i class="bi bi-search"></i></button>
      </form>

      <nav class="nav-links" id="navLinks">
        <a href="/index.html" class="nav-link-item"><i class="bi bi-house"></i> Home</a>
        <a href="/index.html#catalog" class="nav-link-item"><i class="bi bi-grid"></i> Products</a>
        <a href="/orders.html" class="nav-link-item"><i class="bi bi-box-seam"></i> Orders</a>
      </nav>

      <div style="display:flex; align-items:center; gap:14px;">
        <button class="nav-cart-btn" onclick="Cart.openDrawer()">
          <i class="bi bi-bag"></i>
          <span>Cart</span>
          <span class="cart-counter-badge" style="display:none;">0</span>
        </button>
        <div id="nav-auth-container"></div>
        <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="bi bi-list"></i></button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding-top:36px; padding-bottom:60px; max-width:800px;">
      
      <div style="margin-bottom:28px;">
        <h1 style="font-size:2rem; font-weight:800; color:var(--secondary); letter-spacing:-0.5px;">Account Settings</h1>
        <p style="color:var(--text-muted); font-size:0.92rem;">Manage your profile details and default shipping information</p>
      </div>

      <div id="profileContainer" style="background:#fff; border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:32px; box-shadow:var(--shadow-sm);">
        <form id="profileForm">
          <div style="display:flex; align-items:center; gap:20px; margin-bottom:28px; border-bottom:1px solid var(--border-color); padding-bottom:24px;">
            <div id="profileAvatar" style="width:68px; height:68px; border-radius:50%; background:linear-gradient(135deg, var(--primary), #818cf8); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.6rem; font-weight:800;">
              U
            </div>
            <div>
              <h3 id="profileNameHeader" style="font-size:1.25rem; font-weight:700; color:var(--secondary);">User Name</h3>
              <p id="profileEmailHeader" style="color:var(--text-muted); font-size:0.88rem;">user@example.com</p>
              <div style="margin-top:6px;">
                <span id="profileRoleBadge" class="badge-status delivered" style="font-size:0.75rem;">Customer Account</span>
              </div>
            </div>
          </div>

          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label" for="profileName">Full Name</label>
              <input type="text" id="profileName" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="profilePhone">Phone Number</label>
              <input type="tel" id="profilePhone" class="form-control" placeholder="+1 (555) 000-0000">
            </div>

            <div class="form-group">
              <label class="form-label" for="profileCountry">Country</label>
              <select id="profileCountry" class="form-control">
                <option value="United States">United States</option>
                <option value="Canada">Canada</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Australia">Australia</option>
                <option value="Germany">Germany</option>
                <option value="India">India</option>
              </select>
            </div>

            <div class="form-group" style="grid-column: 1 / -1;">
              <label class="form-label" for="profileAddress">Default Street Address</label>
              <input type="text" id="profileAddress" class="form-control" placeholder="123 Main St, Apt 4">
            </div>

            <div class="form-group">
              <label class="form-label" for="profileCity">City</label>
              <input type="text" id="profileCity" class="form-control" placeholder="City">
            </div>

            <div class="form-group">
              <label class="form-label" for="profileZip">ZIP / Postal Code</label>
              <input type="text" id="profileZip" class="form-control" placeholder="00000">
            </div>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:24px; border-top:1px solid var(--border-color); padding-top:24px;">
            <button type="submit" id="saveProfileBtn" class="btn btn-primary">
              <i class="bi bi-check2"></i> Save Changes
            </button>
            <a href="/orders.html" class="btn btn-outline">
              <i class="bi bi-box-seam"></i> View Orders
            </a>
          </div>
        </form>
      </div>

    </div>
  </main>

  <div id="toast-container"></div>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ShopNova E-Commerce Inc. All rights reserved.</div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!Auth.isLoggedIn()) {
        window.location.href = '/login.html';
        return;
      }

      const user = await Auth.fetchCurrentProfile() || Auth.getUser();
      if (!user) return;

      const avatar = document.getElementById('profileAvatar');
      const nameHeader = document.getElementById('profileNameHeader');
      const emailHeader = document.getElementById('profileEmailHeader');
      const roleBadge = document.getElementById('profileRoleBadge');

      const nameInput = document.getElementById('profileName');
      const phoneInput = document.getElementById('profilePhone');
      const addressInput = document.getElementById('profileAddress');
      const cityInput = document.getElementById('profileCity');
      const zipInput = document.getElementById('profileZip');
      const countryInput = document.getElementById('profileCountry');

      const initials = (user.name || 'U').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
      if (avatar) avatar.textContent = initials;
      if (nameHeader) nameHeader.textContent = user.name;
      if (emailHeader) emailHeader.textContent = user.email;
      if (roleBadge) roleBadge.textContent = user.role === 'admin' ? 'Store Administrator' : 'Verified Customer';

      if (nameInput) nameInput.value = user.name || '';
      if (phoneInput) phoneInput.value = user.phone || '';
      if (addressInput) addressInput.value = user.address || '';
      if (cityInput) cityInput.value = user.city || '';
      if (zipInput) zipInput.value = user.postal_code || '';
      if (countryInput && user.country) countryInput.value = user.country;

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const saveBtn = document.getElementById('saveProfileBtn');
        saveBtn.disabled = true;

        try {
          const res = await API.put('/api/auth/profile', {
            name: nameInput.value.trim(),
            phone: phoneInput.value.trim(),
            address: addressInput.value.trim(),
            city: cityInput.value.trim(),
            postal_code: zipInput.value.trim(),
            country: countryInput.value
          });

          if (res.success && res.user) {
            Auth.setSession(Auth.getToken(), res.user);
            showToast('Profile information updated successfully!', 'success');
            nameHeader.textContent = res.user.name;
          }
        } catch (err) {
          showToast(err.message || 'Error updating profile', 'error');
        } finally {
          saveBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
