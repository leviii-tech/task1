<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ShopNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body style="background-color:var(--bg-alt);">

  <header class="site-header">
    <div class="container nav-bar" style="height:64px;">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon"><i class="bi bi-bag-check-fill"></i></div>
        <div class="brand-text">Shop<span>Nova</span></div>
      </a>
      <a href="/index.html" class="btn btn-outline btn-sm"><i class="bi bi-arrow-left"></i> Back to Store</a>
    </div>
  </header>

  <main class="main-content" style="display:flex; align-items:center; justify-content:center; padding: 48px 20px;">
    <div style="background:#fff; border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:36px; max-width:440px; width:100%; box-shadow:var(--shadow-md);">
      
      <div style="text-align:center; margin-bottom:24px;">
        <h1 style="font-size:1.6rem; font-weight:800; color:var(--secondary); margin-bottom:6px;">Welcome Back</h1>
        <p style="color:var(--text-muted); font-size:0.88rem;">Sign in to access your saved cart, orders, and addresses</p>
      </div>

      <!-- Quick Demo Login Buttons -->
      <div style="background:var(--bg-alt); border-radius:var(--radius-md); padding:16px; margin-bottom:24px; border:1px solid var(--border-color);">
        <div style="font-size:0.78rem; font-weight:700; text-transform:uppercase; color:var(--text-muted); margin-bottom:10px; letter-spacing:0.5px;">
          ⚡ Instant One-Click Demo Access
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button type="button" class="btn btn-outline btn-sm btn-block" style="background:#fff;" onclick="quickDemoLogin('customer')">
            <i class="bi bi-person-check-fill" style="color:var(--primary);"></i> Login as Demo Customer (John Doe)
          </button>
          <button type="button" class="btn btn-outline btn-sm btn-block" style="background:#fff;" onclick="quickDemoLogin('admin')">
            <i class="bi bi-shield-lock-fill" style="color:var(--accent);"></i> Login as Store Admin
          </button>
        </div>
      </div>

      <div style="display:flex; align-items:center; margin-bottom:24px;">
        <div style="flex:1; height:1px; background:var(--border-color);"></div>
        <span style="padding:0 12px; font-size:0.78rem; color:var(--text-light); text-transform:uppercase;">Or with email</span>
        <div style="flex:1; height:1px; background:var(--border-color);"></div>
      </div>

      <!-- Standard Login Form -->
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-block btn-lg" style="margin-top:20px;">
          Sign In <i class="bi bi-arrow-right"></i>
        </button>
      </form>

      <div style="text-align:center; margin-top:24px; font-size:0.88rem; color:var(--text-muted);">
        Don't have an account yet? 
        <a href="/register.html" style="color:var(--primary); font-weight:600;">Create one now</a>
      </div>

    </div>
  </main>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function quickDemoLogin(role) {
      try {
        const res = await Auth.demoLogin(role);
        if (res.success) {
          showToast(`Logged in as demo ${role}!`, 'success');
          setTimeout(() => {
            window.location.href = role === 'admin' ? '/admin.html' : '/index.html';
          }, 400);
        }
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      btn.disabled = true;
      btn.innerHTML = `<i class="bi bi-arrow-repeat" style="animation:spin 1s infinite linear;"></i> Signing in...`;

      try {
        const res = await Auth.login(email, password);
        if (res.success) {
          showToast('Welcome back, ' + res.user.name + '!', 'success');
          setTimeout(() => {
            window.location.href = res.user.role === 'admin' ? '/admin.html' : '/index.html';
          }, 400);
        }
      } catch (err) {
        showToast(err.message || 'Login failed. Please check credentials.', 'error');
        btn.disabled = false;
        btn.innerHTML = `Sign In <i class="bi bi-arrow-right"></i>`;
      }
    });
  </script>
</body>
</html>
