<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - ShopNova</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="container nav-bar">
      <a href="/index.html" class="brand-logo">
        <div class="brand-icon"><i class="bi bi-bag-check-fill"></i></div>
        <div class="brand-text">Shop<span>Nova</span></div>
      </a>

      <form class="nav-search-form">
        <input type="text" class="nav-search-input" placeholder="Search gadgets, audio, laptops...">
        <button type="submit" class="nav-search-btn"><i class="bi bi-search"></i></button>
      </form>

      <nav class="nav-links" id="navLinks">
        <a href="/index.html" class="nav-link-item"><i class="bi bi-house"></i> Home</a>
        <a href="/index.html#catalog" class="nav-link-item"><i class="bi bi-grid"></i> Products</a>
        <a href="/orders.html" class="nav-link-item active"><i class="bi bi-box-seam"></i> Orders</a>
      </nav>

      <div style="display:flex; align-items:center; gap:14px;">
        <button class="nav-cart-btn" onclick="Cart.openDrawer()">
          <i class="bi bi-bag"></i>
          <span>Cart</span>
          <span class="cart-counter-badge" style="display:none;">0</span>
        </button>
        <div id="nav-auth-container"></div>
        <button class="mobile-menu-btn" id="mobileMenuBtn"><i class="bi bi-list"></i></button>
      </div>
    </div>
  </header>

  <main class="main-content">
    <div class="container" style="padding-top:36px; padding-bottom:60px; max-width:920px;">
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:12px;">
        <div>
          <h1 style="font-size:2rem; font-weight:800; color:var(--secondary); letter-spacing:-0.5px;">Order History</h1>
          <p style="color:var(--text-muted); font-size:0.92rem;">Review your placed orders, tracking updates, and invoices</p>
        </div>
        <a href="/index.html#catalog" class="btn btn-primary btn-sm">
          <i class="bi bi-bag"></i> New Purchase
        </a>
      </div>

      <!-- Populated by orders.js initOrdersPage() -->
      <div id="ordersHistoryContainer">
        <!-- Renders order cards -->
      </div>

    </div>
  </main>

  <!-- Slide-Over Cart Drawer -->
  <div class="cart-drawer-backdrop" id="cartBackdrop" onclick="Cart.closeDrawer()"></div>
  <div class="cart-drawer" id="cartDrawer">
    <div class="cart-drawer-header">
      <div class="cart-drawer-title"><i class="bi bi-bag-check" style="color:var(--primary);"></i> Shopping Cart</div>
      <button class="cart-close-btn" onclick="Cart.closeDrawer()"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="cart-items-list" id="cartDrawerItems"></div>
    <div class="cart-drawer-footer">
      <div class="cart-summary-row total"><span>Total</span><span id="cartDrawerTotal">$0.00</span></div>
      <div class="cart-footer-actions">
        <a href="/checkout.html" class="btn btn-primary btn-block btn-lg">Checkout</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <div>&copy; 2026 ShopNova E-Commerce Inc. All rights reserved.</div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/orders.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OrdersManager.initOrdersPage();
    });
  </script>
</body>
</html>
